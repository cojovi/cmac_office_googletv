org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---------------------------------------------------------------------------
# Deployment configuration
#
# Override these in local.properties (gitignored) or on the Gradle command
# line, e.g.  ./gradlew assembleRelease -PCMAC_SERVER_URL=http://10.0.0.5:3000
#
# CMAC_SERVER_URL — base URL of the existing CMAC_Office_dash Express server.
#   The TV app is a native client of that server's API, exactly as the browser
#   is today, so the Bolt credentials stay server-side and never ship in the APK.
#
# CMAC_MAPBOX_TOKEN — Mapbox *public* (pk.) token, used for the Static Images
#   API that renders the dispatch map. This is the same public token the web
#   app already injects into its HTML, so it is no more exposed here than it
#   is in the browser. Leave blank to show the same "MAP UNAVAILABLE"
#   placeholder the web dashboard shows when the token is missing.
# ---------------------------------------------------------------------------
CMAC_SERVER_URL=
CMAC_MAPBOX_TOKEN=
